name: Build Android TV RIFE APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature/*"
      - "test-jules-build"
  pull_request:
    branches:
      - "main"

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Submodule Contents
        run: |
          echo "=== Verifying submodule contents ==="
          ls -la third_party/
          test -f third_party/ncnn/src/ncnn_glsl_ext.comp && echo "PASS: ncnn_glsl_ext.comp exists" || (echo "FAIL: ncnn_glsl_ext.comp missing" && exit 1)
          test -f third_party/rife-ncnn-vulkan/src/generate_shader_comp_header.cmake && echo "PASS: generate_shader_comp_header.cmake exists" || (echo "FAIL: generate_shader_comp_header.cmake missing" && exit 1)

      - name: Install glslangValidator
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          which glslangValidator
          glslangValidator --version
          echo "/usr/bin" >> $GITHUB_PATH

      - name: Run CMake Preflight
        env:
          PATH: /usr/bin:/usr/local/bin:${{ env.PATH }}
        run: |
          cmake -S app/src/main/cpp -B build/preflight -DCMAKE_BUILD_TYPE=Debug 2>&1 | tail -20
          cmake --build build/preflight --target rife-preflight 2>&1 | tail -30

  build:
    name: Build Android TV RIFE APK
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - name: Install glslangValidator
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          which glslangValidator
          glslangValidator --version
          echo "/usr/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        env:
          PATH: /usr/bin:/usr/local/bin:${{ env.PATH }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Collect Native Libraries
        run: |
          mkdir -p native-libs
          find app/build -type f -name "librife_native.so" -exec cp --parents {} native-libs/ \;

      - name: Upload Native Libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native-libs
          if-no-files-found: warn