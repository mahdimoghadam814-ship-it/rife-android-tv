name: Build Android TV RIFE APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature/*"
      - "test-jules-build"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
  uses: actions/upload-artifact@v4
  with:
    name: app-debug
    path: app/build/outputs/apk/debug/app-debug.apk

     - name: Upload Native Debug Symbols
  uses: actions/upload-artifact@v4
  with:
    name: native-debug-symbols
    path: |
      app/build/intermediates/cxx/Debug/**/obj/**/lib/armeabi-v7a/librife_native.so
      app/build/intermediates/cxx/Debug/**/obj/**/lib/arm64-v8a/librife_native.so
      app/build/intermediates/cxx/Debug/**/obj/**/lib/armeabi-v7a/*.so
      app/build/intermediates/cxx/Debug/**/obj/**/lib/arm64-v8a/*.so
    if-no-files-found: warn
