name: Android TV Debug Build

on:
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:

      - name: Verify SVP-only project layout
        run: |
          set -euo pipefail
          echo "=== Checkout ==="; git rev-parse HEAD
          echo "=== Gradle wrapper ==="
          test -f ./gradlew || { echo "FAIL: gradlew missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "FAIL: wrapper jar missing"; exit 1; }
          echo "PASS: Gradle wrapper present"
          echo "=== Native/CMake configuration required by SVP ==="
          test -d app/src/main/cpp || { echo "FAIL: app/src/main/cpp missing"; exit 1; }
          test -f app/src/main/cpp/CMakeLists.txt || { echo "FAIL: CMakeLists.txt missing"; exit 1; }
          grep -Eq "add_library\([[:space:]]*rife_native" app/src/main/cpp/CMakeLists.txt \
            || { echo "FAIL: SVP-only target rife_native not declared"; exit 1; }
          echo "PASS: CMakeLists.txt declares add_library(rife_native ...)"
          echo "=== Native sources referenced by the current CMake configuration ==="
          for src in rife_jni.cpp memc_interpolator.cpp memc_interpolator.h; do
            test -f "app/src/main/cpp/$src" || { echo "FAIL: $src missing"; exit 1; }
            echo "PASS: app/src/main/cpp/$src"
          done
          echo "=== Obsolete RIFE inputs must not be reintroduced ==="
          test ! -f .gitmodules || { echo "FAIL: .gitmodules reintroduced"; exit 1; }
          if [ -n "$(git ls-files third_party)" ]; then
            echo "FAIL: third_party has tracked files again"; git ls-files third_party; exit 1
          fi
          echo "PASS: no .gitmodules, no tracked third_party files"
          echo "=== Preflight OK ==="

  build-debug-apk:
    name: Build debug APK (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Versions taken from the project's own app/build.gradle.kts
          # (compileSdk 37, ndkVersion 26.3.11579264, cmake 3.22.1).
          packages: "platform-tools platforms;android-37 build-tools;37.0.0 ndk;26.3.11579264 cmake;3.22.1"


      - name: Build debug APK with Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rife-android-tv-debug-apk
          path: "app/build/outputs/apk/**/*.apk"
          if-no-files-found: error

      - name: Verify APK ABI compatibility
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          echo "Found APK: $APK_PATH"

          # List all native libraries in the APK
          echo "=== APK native libraries ==="
          unzip -l "$APK_PATH" "lib/*/*.so" | grep "\.so$"

          # Extract ABI directories present
          echo "=== Detected APK ABIs ==="
          ABI_DIRS=$(unzip -l "$APK_PATH" "lib/*/*.so" | grep -oP 'lib/\K[^/]+' | sort -u)
          echo "$ABI_DIRS"

          # Verify required ABIs
          REQUIRED_ABIS=("arm64-v8a" "armeabi-v7a")
          MISSING_ABIS=()
          for abi in "${REQUIRED_ABIS[@]}"; do
            if echo "$ABI_DIRS" | grep -q "^${abi}$"; then
              echo "- ${abi}: OK"
            else
              echo "- ${abi}: MISSING"
              MISSING_ABIS+=("$abi")
            fi
          done

          # Verify librife_native.so exists for each required ABI
          echo "=== RIFE native library ==="
          MISSING_RIFE=()
          for abi in "${REQUIRED_ABIS[@]}"; do
            if unzip -l "$APK_PATH" "lib/${abi}/librife_native.so" | grep -q "librife_native.so"; then
              echo "- ${abi}/librife_native.so: OK"
            else
              echo "- ${abi}/librife_native.so: MISSING"
              MISSING_RIFE+=("$abi")
            fi
          done

          # Fail if any requirements not met
          if [ ${#MISSING_ABIS[@]} -gt 0 ] || [ ${#MISSING_RIFE[@]} -gt 0 ]; then
            echo "ERROR: APK verification failed!"
            [ ${#MISSING_ABIS[@]} -gt 0 ] && echo "Missing ABIs: ${MISSING_ABIS[*]}"
            [ ${#MISSING_RIFE[@]} -gt 0 ] && echo "Missing librife_native.so for: ${MISSING_RIFE[*]}"
            exit 1
          fi

          echo "SUCCESS: All ABI verification checks passed!"

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/**
            build/reports/**
          # Reports are optional: a missing/empty report set must not fail the run.
          if-no-files-found: warn