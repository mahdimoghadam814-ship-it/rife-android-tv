name: Android TV Debug Build

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # third_party/ncnn and third_party/rife-ncnn-vulkan are declared
          # submodules of this repository and are required by the CMake native build.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Versions taken from the project's own app/build.gradle.kts
          # (compileSdk 37, ndkVersion 26.3.11579264, cmake 3.22.1).
          packages: "platform-tools platforms;android-37 build-tools;37.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - name: Install glslangValidator
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools
          # Also check NDK shader-tools path
          ls -la $ANDROID_NDK_HOME/shader-tools/ 2>/dev/null || echo "NDK shader-tools not found"
          which glslangValidator

      - name: Build debug APK with Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rife-android-tv-debug-apk
          path: "app/build/outputs/apk/**/*.apk"
          if-no-files-found: error

      - name: Verify APK ABI compatibility
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          echo "Found APK: $APK_PATH"

          # List all native libraries in the APK
          echo "=== APK native libraries ==="
          unzip -l "$APK_PATH" "lib/*/*.so" | grep "\.so$"

          # Extract ABI directories present
          echo "=== Detected APK ABIs ==="
          ABI_DIRS=$(unzip -l "$APK_PATH" "lib/*/*.so" | grep -oP 'lib/\K[^/]+' | sort -u)
          echo "$ABI_DIRS"

          # Verify required ABIs
          REQUIRED_ABIS=("arm64-v8a" "armeabi-v7a")
          MISSING_ABIS=()
          for abi in "${REQUIRED_ABIS[@]}"; do
            if echo "$ABI_DIRS" | grep -q "^${abi}$"; then
              echo "- ${abi}: OK"
            else
              echo "- ${abi}: MISSING"
              MISSING_ABIS+=("$abi")
            fi
          done

          # Verify librife_native.so exists for each required ABI
          echo "=== RIFE native library ==="
          MISSING_RIFE=()
          for abi in "${REQUIRED_ABIS[@]}"; do
            if unzip -l "$APK_PATH" "lib/${abi}/librife_native.so" | grep -q "librife_native.so"; then
              echo "- ${abi}/librife_native.so: OK"
            else
              echo "- ${abi}/librife_native.so: MISSING"
              MISSING_RIFE+=("$abi")
            fi
          done

          # Fail if any requirements not met
          if [ ${#MISSING_ABIS[@]} -gt 0 ] || [ ${#MISSING_RIFE[@]} -gt 0 ]; then
            echo "ERROR: APK verification failed!"
            [ ${#MISSING_ABIS[@]} -gt 0 ] && echo "Missing ABIs: ${MISSING_ABIS[*]}"
            [ ${#MISSING_RIFE[@]} -gt 0 ] && echo "Missing librife_native.so for: ${MISSING_RIFE[*]}"
            exit 1
          fi

          echo "SUCCESS: All ABI verification checks passed!"

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/**
            build/reports/**
          # Reports are optional: a missing/empty report set must not fail the run.
          if-no-files-found: warn