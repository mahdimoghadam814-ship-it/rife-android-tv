name: Android TV Debug Build

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # third_party/ncnn and third_party/rife-ncnn-vulkan are declared
          # submodules of this repository and are required by the CMake native build.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Versions taken from the project's own app/build.gradle.kts
          # (compileSdk 34, ndkVersion 26.3.11579264, cmake 3.22.1).
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - name: Build debug APK with Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rife-android-tv-debug-apk
          path: "app/build/outputs/apk/**/*.apk"
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/**
            build/reports/**
          # Reports are optional: a missing/empty report set must not fail the run.
          if-no-files-found: warn
